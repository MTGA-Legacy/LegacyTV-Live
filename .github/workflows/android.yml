name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm,android-arm64
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/LegacyTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: legacytv-apk
          path: build/app/outputs/flutter-apk/LegacyTV.apk
