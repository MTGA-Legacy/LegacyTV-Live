name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # 分 ABI 输出：老电视安装 arm32 包时不会携带 arm64-v8a 原生库。
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Rename and verify ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          output_dir="build/app/outputs/flutter-apk"

          arm32_source="$output_dir/app-armeabi-v7a-release.apk"
          arm64_source="$output_dir/app-arm64-v8a-release.apk"
          test -f "$arm32_source"
          test -f "$arm64_source"
          cp "$arm32_source" "$output_dir/LegacyTV-arm32.apk"
          cp "$arm64_source" "$output_dir/LegacyTV-arm64.apk"

          if unzip -l "$output_dir/LegacyTV-arm32.apk" | grep -q 'lib/arm64-v8a/'; then
            echo 'arm32 APK unexpectedly contains arm64-v8a libraries' >&2
            exit 1
          fi
          unzip -l "$output_dir/LegacyTV-arm32.apk" | grep -q 'lib/armeabi-v7a/libijkplayer.so'
          unzip -l "$output_dir/LegacyTV-arm64.apk" | grep -q 'lib/arm64-v8a/libijkplayer.so'
      - uses: actions/upload-artifact@v4
        with:
          name: legacytv-apks
          path: |
            build/app/outputs/flutter-apk/LegacyTV-arm32.apk
            build/app/outputs/flutter-apk/LegacyTV-arm64.apk
